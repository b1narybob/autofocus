<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f1e3">
<title>Autofocus — Mark Forster's system, working</title>
<style>
:root{
  --paper:#f8f4e7; --paper2:#f3eedd; --ink:#2b2b26; --ink-soft:#5c5a50;
  --rule:#d8d2bd; --margin:#d98a8a; --accent:#2f5d3a; --accent-ink:#fff;
  --hl:#fff3a3; --danger:#a33b3b; --tab:#efe9d6;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:#e9e2cd; color:var(--ink); line-height:1.45;
  max-width:680px; margin:0 auto; min-height:100vh; min-height:100dvh;
  display:flex; flex-direction:column; padding-bottom:76px;
}
header{position:sticky;top:0;z-index:20;background:#efe9d6;border-bottom:1px solid var(--rule)}
#nbTabs{display:flex;gap:8px;padding:10px 12px;overflow-x:auto;align-items:center}
.nbtab{border:1px solid var(--rule);background:var(--paper);border-radius:999px;
  padding:7px 14px;font-size:15px;white-space:nowrap;cursor:pointer;color:var(--ink)}
.nbtab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.nbadd{border:1px dashed var(--rule);background:transparent;border-radius:999px;
  padding:7px 12px;font-size:15px;color:var(--ink-soft);cursor:pointer;white-space:nowrap}
main{padding:12px 12px 24px;flex:1}
.page{
  background:
    linear-gradient(90deg, transparent 44px, var(--margin) 44px, var(--margin) 46px, transparent 46px),
    repeating-linear-gradient(var(--paper) 0 30px, var(--rule) 30px 31px);
  background-color:var(--paper);
  border:1px solid var(--rule); border-radius:6px; box-shadow:0 2px 6px rgba(60,50,20,.12);
  margin:0 0 16px; padding:10px 10px 14px 56px;
}
.pagehead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.pagehead h3{margin:0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
.badge{font-size:12px;color:var(--ink-soft);border:1px solid var(--rule);border-radius:999px;padding:2px 9px;background:#fff8}
.badge.closed{background:#e4ddc4}
.task{display:flex;gap:10px;align-items:flex-start;padding:7px 2px;min-height:31px;border-bottom:1px dotted #0000}
.task .box{flex:0 0 auto;width:20px;height:20px;border:2px solid var(--ink-soft);border-radius:4px;margin-top:2px;background:#fff;cursor:pointer}
.task.done .box{background:var(--ink-soft);border-color:var(--ink-soft)}
.task .txt{flex:1;font-size:16px;overflow-wrap:anywhere}
.task.done .txt{color:var(--ink-soft);text-decoration:line-through}
.task.dismissed .txt{background:var(--hl);text-decoration:line-through;color:var(--ink-soft)}
.task .meta{font-size:12px;color:var(--ink-soft)}
.datemark{font-size:12px;font-weight:700;color:var(--accent);margin-right:6px}
.acts{display:flex;gap:2px}
.acts button{border:0;background:none;font-size:16px;padding:6px;cursor:pointer;color:var(--ink-soft);line-height:1}
.addrow{display:flex;gap:8px;margin-top:8px}
.addrow input{flex:1;font-size:16px;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;background:#fff}
.btn{display:inline-block;border:0;border-radius:10px;background:var(--ink);color:#fff;
  font-size:16px;padding:11px 18px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--rule)}
.btn.green{background:var(--accent)}
.btn.danger{background:var(--danger)}
.btn.block{width:100%;margin-top:10px}
.btnrow{display:flex;gap:10px;margin-top:12px}
.btnrow .btn{flex:1}
.warn{background:#fff8d6;border:1px solid #e3cf6a;border-radius:8px;padding:10px 12px;font-size:14px;margin:8px 0}
.notice{background:#eef3e7;border:1px solid #b9cba4;border-radius:8px;padding:10px 12px;font-size:14px;margin:8px 0}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:19px}
.card h3{margin:14px 0 6px;font-size:16px}
.muted{color:var(--ink-soft);font-size:14px}
.big-task{font-size:22px;font-weight:600;margin:6px 0 12px;overflow-wrap:anywhere}
.timer{font-size:15px;color:var(--ink-soft);font-variant-numeric:tabular-nums;margin-bottom:12px}
textarea.note{width:100%;min-height:70px;font-size:15px;padding:10px;border:1px solid var(--rule);border-radius:8px;background:#fff;font-family:inherit}
input.text{width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;background:#fff;margin-top:6px}
label.f{display:block;font-size:14px;color:var(--ink-soft);margin:10px 0 2px}
.progress{font-size:13px;color:var(--ink-soft);margin-bottom:8px}
nav#tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:680px;
  display:flex;background:var(--tab);border-top:1px solid var(--rule);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav#tabs button{flex:1;border:0;background:none;padding:12px 4px;font-size:13px;color:var(--ink-soft);cursor:pointer}
nav#tabs button.on{color:var(--ink);font-weight:700}
#modal{position:fixed;inset:0;background:rgba(30,25,10,.5);display:none;z-index:50;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto}
#modal.open{display:flex}
.sheet{background:var(--paper);border-radius:12px;max-width:600px;width:100%;padding:18px;max-height:85vh;overflow-y:auto}
.sheet h2{margin-top:0}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dotted var(--rule);font-size:15px}
.logday{font-weight:700;margin:14px 0 4px;font-size:15px}
.logitem{padding:4px 0 4px 18px;font-size:15px;position:relative}
.logitem:before{content:"✓";position:absolute;left:0;color:var(--accent)}
details.closedpage{margin-bottom:12px}
details.closedpage summary{cursor:pointer;font-size:14px;color:var(--ink-soft);padding:6px 2px}
ol.steps{padding-left:20px;font-size:15px}
ol.steps li{margin-bottom:8px}
ul.donts{padding-left:20px;font-size:15px}
ul.donts li{margin-bottom:6px}
.center{text-align:center;padding:40px 20px}
.focusbox{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:20px;box-shadow:0 2px 6px rgba(60,50,20,.12)}
.checkline{display:flex;gap:10px;align-items:center;margin:12px 0;font-size:15px}
.checkline input{width:20px;height:20px}
</style>
</head>
<body>
<header><div id="nbTabs"></div></header>
<main id="view"></main>
<nav id="tabs">
  <button data-v="list">📓 List</button>
  <button data-v="focus">🎯 Focus</button>
  <button data-v="log">✓ Log</button>
  <button data-v="more">⋯ More</button>
</nav>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<script>
"use strict";
/* ============ storage ============ */
const LS_KEY = "autofocus-v1";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function seedState(){
  const mk = name => ({ id: uid(), name, tasks: [] });
  return { notebooks: [mk("Home"), mk("Workplace")], activeNbId: null,
           settings: { pageSize: 25 }, lastVisit: Date.now() };
}
let S;
try { S = JSON.parse(localStorage.getItem(LS_KEY)) || seedState(); }
catch(e){ S = seedState(); }
if(!S.notebooks || !S.notebooks.length) S = seedState();
if(!S.activeNbId || !S.notebooks.some(n => n.id === S.activeNbId)) S.activeNbId = S.notebooks[0].id;
const save = () => { try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} };
save();

/* ============ model ============ */
const nb = () => S.notebooks.find(n => n.id === S.activeNbId) || S.notebooks[0];
const pageSize = () => Math.min(40, Math.max(10, S.settings.pageSize || 25));
const lastPage = n => n.tasks.reduce((m,t) => Math.max(m, t.page), 0);
function openTasks(n, p){ return n.tasks.filter(t => t.page === p && t.status === "open"); }
function pageInfo(n, p){
  const ts = n.tasks.filter(t => t.page === p);
  const open = ts.filter(t => t.status === "open").length;
  const dismissed = n.dismissedPages && n.dismissedPages.includes(p);
  const isLast = p === lastPage(n);
  const active = isLast || (open > 0 && !dismissed);
  return { n:p, tasks:ts, open, isLast, dismissed:!!dismissed, active,
           closed: !active && ts.length > 0 };
}
function allPages(n){
  const out = [];
  for(let p = 0; p <= lastPage(n); p++) out.push(pageInfo(n, p));
  return out;
}
function firstActivePage(n){
  const ps = allPages(n).filter(p => p.active);
  return ps.length ? ps[0].n : -1;
}
function addTask(n, text, opts){
  opts = opts || {};
  text = String(text).trim();
  if(!text) return null;
  let p = lastPage(n);
  if(n.tasks.filter(t => t.page === p).length >= pageSize()) p++;
  const day = new Date().toDateString();
  const hasMark = n.tasks.some(t => new Date(t.createdAt).toDateString() === day && t.dateMark);
  const t = { id: uid(), text, note: opts.note || "", status: "open", page: p,
              createdAt: Date.now(), doneAt: null, reentryOf: opts.reentryOf || null,
              sessions: 0, workMs: 0, dateMark: !hasMark };
  n.tasks.push(t); save(); return t;
}
function findTask(id){
  for(const n of S.notebooks){ const t = n.tasks.find(t => t.id === id); if(t) return {n, t}; }
  return null;
}
const dayLabel = ts => new Date(ts).toLocaleDateString(undefined, {month:"short", day:"numeric", year:"numeric"});
const weekdayLabel = ts => new Date(ts).toLocaleDateString(undefined, {weekday:"long", month:"long", day:"numeric"});
function fmtDur(ms){
  const s = Math.floor(ms/1000), h = Math.floor(s/3600), m = Math.floor(s%3600/60), ss = s%60;
  const p = x => String(x).padStart(2,"0");
  return h > 0 ? h+":"+p(m)+":"+p(ss) : m+":"+p(ss);
}
function dismissedMatch(n, text){
  const norm = s => s.toLowerCase().replace(/[^a-z0-9 ]/g,"").trim();
  const q = norm(text); if(q.length < 4) return null;
  return n.tasks.find(t => t.status === "dismissed" && (norm(t.text).includes(q) || q.includes(norm(t.text)))) || null;
}

/* ============ chrome ============ */
const view = document.getElementById("view");
let curView = "list";
function renderTabs(){
  const el = document.getElementById("nbTabs");
  el.innerHTML = S.notebooks.map(n =>
    `<button class="nbtab${n.id===S.activeNbId?" on":""}" data-nb="${n.id}">${esc(n.name)}</button>`).join("") +
    `<button class="nbadd" id="nbAdd">+ Notebook</button>`;
  el.querySelectorAll("[data-nb]").forEach(b => b.onclick = () => { S.activeNbId = b.dataset.nb; F = null; save(); renderTabs(); go(curView); });
  document.getElementById("nbAdd").onclick = () => {
    const name = prompt("Notebook name:"); if(!name || !name.trim()) return;
    const n = { id: uid(), name: name.trim(), tasks: [] };
    S.notebooks.push(n); S.activeNbId = n.id; F = null; save(); renderTabs(); go("list");
  };
}
document.querySelectorAll("nav#tabs button").forEach(b => b.onclick = () => go(b.dataset.v));
function go(v){
  curView = v;
  document.querySelectorAll("nav#tabs button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  stopTimer();
  ({list:renderList, focus:renderFocus, log:renderLog, more:renderMore}[v])();
}
function modal(html){
  const m = document.getElementById("modal"), sh = document.getElementById("sheet");
  sh.innerHTML = html + `<div class="btnrow"><button class="btn block" id="mClose">Close</button></div>`;
  m.classList.add("open");
  document.getElementById("mClose").onclick = () => m.classList.remove("open");
  m.onclick = e => { if(e.target === m) m.classList.remove("open"); };
}

/* ============ list view ============ */
function taskRow(n, t){
  const acts = t.status === "open"
    ? `<span class="acts">
        <button data-act="done" data-id="${t.id}" title="Done">✓</button>
        <button data-act="reenter" data-id="${t.id}" title="Re-enter at end">↩</button>
        <button data-act="dismiss" data-id="${t.id}" title="Dismiss">⊘</button>
        <button data-act="edit" data-id="${t.id}" title="Edit">✎</button>
        <button data-act="del" data-id="${t.id}" title="Delete">🗑</button>
       </span>` : "";
  const dm = t.dateMark ? `<span class="datemark">${esc(dayLabel(t.createdAt))}</span>` : "";
  const note = t.note ? `<div class="meta">${esc(t.note)}</div>` : "";
  return `<div class="task ${t.status}">
    <span class="box" data-act="done" data-id="${t.id}"></span>
    <span class="txt">${dm}${esc(t.text)}${note}</span>${acts}</div>`;
}
function renderList(){
  const n = nb();
  const pages = allPages(n);
  let html = "";
  if(!n.tasks.length){
    html += `<div class="center"><div style="font-size:44px">📓</div>
      <h2>${esc(n.name)} is empty</h2>
      <p class="muted">Write down everything you need to do.<br>New items always go at the end — no prioritizing.</p></div>`;
  }
  pages.forEach(p => {
    if(!p.tasks.length && !p.isLast) return;
    const head = `<div class="pagehead"><h3>Page ${p.n+1}${p.isLast ? " · writing page" : ""}</h3>
      <span class="badge${p.closed||p.dismissed?" closed":""}">${p.dismissed?"dismissed":p.closed?"closed":p.open+" open"}</span></div>`;
    const rows = p.tasks.map(t => taskRow(n, t)).join("");
    const add = p.isLast ? `<div class="addrow"><input id="addInput" placeholder="Add to the end of the list…" autocomplete="off">
      <button class="btn" id="addBtn">Add</button></div><div id="addWarn"></div>` : "";
    const inner = head + rows + add;
    html += p.closed || p.dismissed
      ? `<details class="closedpage"><summary>Page ${p.n+1} — ${p.dismissed?"dismissed":"closed"} (${p.tasks.length} items)</summary><div class="page">${inner}</div></details>`
      : `<div class="page">${inner}</div>`;
  });
  view.innerHTML = html;
  view.querySelectorAll("[data-act]").forEach(b => b.onclick = e => { e.stopPropagation(); taskAct(b.dataset.act, b.dataset.id); });
  const inp = document.getElementById("addInput");
  if(inp){
    const doAdd = () => {
      const v = inp.value; if(!v.trim()) return;
      const dup = dismissedMatch(n, v);
      const w = document.getElementById("addWarn");
      if(dup && !w.dataset.acked){
        w.innerHTML = `<div class="warn">You dismissed “${esc(dup.text)}” on ${esc(dayLabel(dup.doneAt||dup.createdAt))}.
          The system rejected it once — only re-enter after reflection.
          <div class="btnrow"><button class="btn ghost" id="wAdd">Add it anyway</button></div></div>`;
        w.dataset.acked = "1";
        document.getElementById("wAdd").onclick = () => { addTask(n, v); renderList(); };
        return;
      }
      addTask(n, v); renderList();
    };
    document.getElementById("addBtn").onclick = doAdd;
    inp.onkeydown = e => { if(e.key === "Enter") doAdd(); };
  }
}
function taskAct(act, id){
  const f = findTask(id); if(!f) return;
  const {n, t} = f;
  if(act === "done"){ t.status = "done"; t.doneAt = Date.now(); }
  else if(act === "dismiss"){ if(confirm("Dismiss this item?")){ t.status = "dismissed"; t.doneAt = Date.now(); } else return; }
  else if(act === "del"){ if(confirm("Delete this item permanently?")) n.tasks = n.tasks.filter(x => x.id !== id); else return; }
  else if(act === "edit"){
    const v = prompt("Edit task:", t.text); if(v === null) return;
    if(v.trim()) t.text = v.trim(); else return;
  }
  else if(act === "reenter"){
    const v = prompt("Re-enter at the end of the list (edit freely):", t.text); if(v === null) return;
    if(v.trim()){ addTask(n, v.trim(), {reentryOf: t.id}); t.status = "done"; t.doneAt = Date.now(); }
    else return;
  }
  save(); renderList();
}

/* ============ focus pass ============ */
let F = null, timerInt = null;
function stopTimer(){ if(timerInt){ clearInterval(timerInt); timerInt = null; } }
function renderFocus(){
  const n = nb();
  if(!F || F.nbId !== n.id) F = { nbId: n.id, page: firstActivePage(n), phase: "read", idx: 0, pass: 1, order: [], worked: 0, t0: 0, elapsed: 0 };
  if(F.page < 0){ view.innerHTML = `<div class="center"><div style="font-size:44px">🎉</div><h2>All clear</h2>
    <p class="muted">Nothing outstanding. Add a task to start a new page.</p>
    <button class="btn" onclick="go('list')">Add a task</button></div>`; return; }
  const p = pageInfo(n, F.page);
  if(F.phase === "read"){
    const items = openTasks(n, F.page);
    view.innerHTML = `<div class="focusbox"><div class="progress">Page ${F.page+1} · quick read — no acting yet</div>
      ${items.map(t => `<div class="task"><span class="box" style="cursor:default"></span><span class="txt">${esc(t.text)}</span></div>`).join("") || '<p class="muted">No open items on this page.</p>'}
      <button class="btn green block" id="readDone">I've read the page</button></div>`;
    document.getElementById("readDone").onclick = () => {
      F.order = openTasks(n, F.page).map(t => t.id); F.idx = 0; F.worked = 0; F.phase = "scan"; renderFocus();
    };
  }
  else if(F.phase === "scan"){
    if(F.idx >= F.order.length){ endOfPass(); return; }
    const f = findTask(F.order[F.idx]);
    if(!f || f.t.status !== "open" || f.t.page !== F.page){ F.idx++; renderFocus(); return; }
    view.innerHTML = `<div class="focusbox"><div class="progress">Page ${F.page+1} · item ${F.idx+1} of ${F.order.length} · pass ${F.pass}</div>
      <div class="big-task">${esc(f.t.text)}</div>
      ${f.t.note ? `<p class="muted">${esc(f.t.note)}</p>` : ""}
      <div class="btnrow"><button class="btn green" id="sOut">Stands out — work on this</button>
      <button class="btn ghost" id="sNo">Not this one</button></div></div>`;
    document.getElementById("sOut").onclick = () => startWork(f.t.id);
    document.getElementById("sNo").onclick = () => { F.idx++; renderFocus(); };
  }
  else if(F.phase === "work"){
    const f = findTask(F.workId); if(!f){ F.phase = "scan"; F.idx++; renderFocus(); return; }
    view.innerHTML = `<div class="focusbox"><div class="progress">Working · Page ${F.page+1}</div>
      <div class="big-task">${esc(f.t.text)}</div>
      <div class="timer" id="timer">0:00 elapsed — no limit, stop when it feels right</div>
      <label class="f">Note (optional)</label><textarea class="note" id="wNote" placeholder="…">${esc(f.t.note)}</textarea>
      <label class="f">Re-enter text (used only if “Done for now”)</label>
      <input class="text" id="wReentry" value="${esc(f.t.text)}">
      <div class="checkline"><input type="checkbox" id="wRecur"><label for="wRecur">Recurring — re-enter at the end when finished</label></div>
      <div class="btnrow"><button class="btn green" id="wDone">Finished</button></div>
      <div class="btnrow"><button class="btn" id="wPause">Done for now</button>
      <button class="btn ghost" id="wBack">Put back</button></div></div>`;
    F.t0 = Date.now() - F.elapsed;
    const tel = document.getElementById("timer");
    timerInt = setInterval(() => { tel.textContent = fmtDur(Date.now() - F.t0) + " elapsed — no limit, stop when it feels right"; }, 1000);
    const finishCommon = () => {
      stopTimer();
      f.t.note = document.getElementById("wNote").value;
      f.t.sessions++; f.t.workMs += Date.now() - F.t0; F.elapsed = 0;
    };
    document.getElementById("wDone").onclick = () => {
      const recur = document.getElementById("wRecur").checked;
      finishCommon();
      f.t.status = "done"; f.t.doneAt = Date.now(); F.worked++;
      if(recur) addTask(nb(), f.t.text, {reentryOf: f.t.id});
      save(); F.phase = "scan"; F.idx++; renderFocus();
    };
    document.getElementById("wPause").onclick = () => {
      const txt = document.getElementById("wReentry").value.trim() || f.t.text;
      finishCommon();
      addTask(nb(), txt, {reentryOf: f.t.id});
      f.t.status = "done"; f.t.doneAt = Date.now(); F.worked++;
      save(); F.phase = "scan"; F.idx++; renderFocus();
    };
    document.getElementById("wBack").onclick = () => {
      stopTimer(); f.t.note = document.getElementById("wNote").value;
      f.t.sessions++; f.t.workMs += Date.now() - F.t0; F.elapsed = 0;
      save(); F.phase = "scan"; F.idx++; renderFocus();
    };
  }
  else if(F.phase === "dismissed"){
    view.innerHTML = `<div class="focusbox"><div class="progress">Page ${F.page+1} · dismissed</div>
      <h2 style="margin-top:0">Nothing stood out — page dismissed</h2>
      <p class="muted">First pass, nothing called to you. The system treats these as rejected for now. They stay visible, highlighted, on the page.</p>
      ${F.dismissedList.map(t => `<div class="task dismissed"><span class="txt">${esc(t)}</span></div>`).join("")}
      <button class="btn block" id="dNext">Continue to next page</button></div>`;
    document.getElementById("dNext").onclick = advancePage;
  }
}
function startWork(id){ F.workId = id; F.elapsed = 0; F.phase = "work"; renderFocus(); }
function endOfPass(){
  const n = nb();
  if(F.worked === 0 && F.pass === 1 && F.page !== lastPage(n)){
    const items = openTasks(n, F.page);
    items.forEach(t => { t.status = "dismissed"; t.doneAt = Date.now(); });
    n.dismissedPages = n.dismissedPages || [];
    if(!n.dismissedPages.includes(F.page)) n.dismissedPages.push(F.page);
    save();
    F.dismissedList = items.map(t => t.text); F.phase = "dismissed"; renderFocus();
  } else {
    advancePage(true);
  }
}
function advancePage(light){
  const n = nb();
  const act = allPages(n).filter(p => p.active).map(p => p.n).sort((a,b) => a-b);
  if(!act.length){ F.page = -1; F.phase = "read"; renderFocus(); return; }
  const next = act.find(p => p > F.page);
  F.page = (next === undefined) ? act[0] : next;
  F.pass = 1; F.phase = "read"; renderFocus();
}

/* ============ log view ============ */
function renderLog(){
  const n = nb();
  const done = n.tasks.filter(t => t.status === "done").sort((a,b) => b.doneAt - a.doneAt);
  let html = `<div class="card"><h2>Completion log</h2>`;
  if(!done.length) html += `<p class="muted">Nothing finished yet. The log is a quiet record of what you get done.</p>`;
  let lastDay = "";
  done.forEach(t => {
    const d = weekdayLabel(t.doneAt);
    if(d !== lastDay){ html += `<div class="logday">${esc(d)}</div>`; lastDay = d; }
    const sess = t.sessions ? ` <span class="muted">· ${t.sessions} session${t.sessions>1?"s":""}${t.workMs? ", "+fmtDur(t.workMs):""}</span>` : "";
    html += `<div class="logitem">${esc(t.text)}${sess}</div>`;
  });
  view.innerHTML = html + `</div>`;
}

/* ============ more view ============ */
function renderMore(){
  view.innerHTML = `<div class="card"><h2>More</h2>
    <div class="btnrow" style="flex-direction:column">
      <button class="btn ghost block" id="mBacklog">📥 Dump backlog</button>
      <button class="btn ghost block" id="mSettings">⚙ Settings</button>
      <button class="btn ghost block" id="mAbout">📖 About Autofocus</button>
    </div>
    <p class="muted" style="margin-top:14px">Your data lives in this browser (localStorage) on this device.
    Use Export in Settings to move it elsewhere.</p></div>`;
  document.getElementById("mBacklog").onclick = renderBacklog;
  document.getElementById("mSettings").onclick = renderSettings;
  document.getElementById("mAbout").onclick = renderAbout;
}
function renderBacklog(){
  view.innerHTML = `<div class="card"><h2>Dump backlog</h2>
    <p class="muted">Paste or type everything on your mind — one item per line. The system will sift it.
    For a big pile like email, the page suggests one task: “Email Backlog”, worked little and often.</p>
    <textarea class="note" id="blText" style="min-height:160px" placeholder="One item per line…"></textarea>
    <div class="btnrow"><button class="btn green" id="blAdd">Add all to the end</button>
    <button class="btn ghost" onclick="go('more')">Cancel</button></div></div>`;
  document.getElementById("blAdd").onclick = () => {
    const lines = document.getElementById("blText").value.split("\n").map(s => s.trim()).filter(Boolean);
    const n = nb(); lines.forEach(l => addTask(n, l));
    save(); go("list");
  };
}
function renderSettings(){
  const n = nb();
  view.innerHTML = `<div class="card"><h2>Settings</h2>
    <label class="f">Items per page (10–40, the page suggests 25–35)</label>
    <input class="text" id="setPp" type="number" min="10" max="40" value="${pageSize()}">
    <h3>Notebooks</h3>
    ${S.notebooks.map(x => `<div class="kv"><span>${esc(x.name)}${x.id===S.activeNbId?" · current":""}</span>
      <span><button class="btn ghost" style="padding:6px 10px;font-size:14px" data-rn="${x.id}">Rename</button>
      ${S.notebooks.length>1?`<button class="btn ghost" style="padding:6px 10px;font-size:14px" data-del="${x.id}">Delete</button>`:""}</span></div>`).join("")}
    <h3>Backup</h3>
    <div class="btnrow"><button class="btn ghost" id="expBtn">Export JSON</button>
    <button class="btn ghost" id="impBtn">Import JSON</button></div>
    <input type="file" id="impFile" accept=".json" style="display:none">
    <h3>Danger zone</h3>
    <button class="btn danger" id="resetBtn">Reset everything</button>
    <div class="btnrow"><button class="btn ghost" onclick="go('more')">Back</button></div></div>`;
  document.getElementById("setPp").onchange = e => {
    S.settings.pageSize = Math.min(40, Math.max(10, parseInt(e.target.value) || 25)); save();
  };
  view.querySelectorAll("[data-rn]").forEach(b => b.onclick = () => {
    const x = S.notebooks.find(x => x.id === b.dataset.rn);
    const v = prompt("Rename notebook:", x.name); if(v && v.trim()){ x.name = v.trim(); save(); renderTabs(); renderSettings(); }
  });
  view.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    const x = S.notebooks.find(x => x.id === b.dataset.del);
    if(confirm(`Delete notebook “${x.name}” and all its tasks?`)){
      S.notebooks = S.notebooks.filter(y => y.id !== x.id);
      if(S.activeNbId === x.id) S.activeNbId = S.notebooks[0].id;
      F = null; save(); renderTabs(); renderSettings();
    }
  });
  document.getElementById("expBtn").onclick = () => {
    const blob = new Blob([JSON.stringify(S, null, 2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "autofocus-backup.json"; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  };
  document.getElementById("impBtn").onclick = () => document.getElementById("impFile").click();
  document.getElementById("impFile").onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => { try{
        const d = JSON.parse(r.result);
        if(!d.notebooks) throw 0;
        if(confirm("Replace all current data with this backup?")){ S = d; save(); renderTabs(); go("list"); }
      }catch(err){ alert("That file doesn't look like an Autofocus backup."); } };
    r.readAsText(f);
  };
  document.getElementById("resetBtn").onclick = () => {
    if(confirm("Delete ALL notebooks, tasks, and history?") && confirm("Really — everything goes.")){
      S = seedState(); F = null; save(); renderTabs(); go("list");
    }
  };
}
function renderAbout(){
  view.innerHTML = `<div class="card"><h2>About Autofocus</h2>
    <p class="muted">Mark Forster's “psychological” time management system — doing what it says, not what a priority matrix says.
    Full credit: <a href="http://markforster.squarespace.com/autofocus-system/" target="_blank" rel="noopener">markforster.squarespace.com/autofocus-system</a></p>
    <h3>Quick start — the 8 steps</h3>
    <ol class="steps">
      <li>Write down everything you need to do, one line each, in a ruled notebook. New items always go at the end.</li>
      <li>Read through the current page quickly, without taking action.</li>
      <li>Go through the page slowly, in order, until one item stands out.</li>
      <li>Work on it as long as you feel like. If unfinished, re-enter it at the end of the list, then cross it off here.</li>
      <li>Continue through the page the same way until you complete a pass with nothing standing out.</li>
      <li>Move to the next page and repeat.</li>
      <li>After the final page, go back to the first live page.</li>
      <li>If you finish a first pass on a page with nothing standing out, dismiss the whole page (highlight, don't delete) — except the final page you're still writing on.</li>
    </ol>
    <h3>Dos and don'ts (from the page)</h3>
    <ul class="donts">
      <li>Do date the first item you add each day.</li>
      <li>Do re-enter recurring items when finished.</li>
      <li>Do take dismissal seriously — think hard before re-entering a dismissed item.</li>
      <li>Don't prioritize, pre-edit, or sort. Don't add due dates or reminders.</li>
      <li>Don't put time-specific commitments here — those belong on a calendar.</li>
      <li>Don't use it in meetings or for other people's actions.</li>
    </ul>
    <h3>Why it works</h3>
    <p class="muted" style="font-size:15px">Rational prioritizing is slow and usually wrong about what you'll actually do.
    Autofocus outsources the choice to fast pattern-matching: your brain already knows what's ripe. Working in short bursts on what stands out,
    and letting stale pages dismiss themselves, keeps the list honest without willpower.</p>
    <div class="btnrow"><button class="btn ghost" onclick="go('more')">Back</button></div></div>`;
}

/* ============ catch-up & init ============ */
function maybeCatchUp(){
  const n = nb();
  const gap = Date.now() - (S.lastVisit || Date.now());
  S.lastVisit = Date.now(); save();
  if(gap < 8*3600*1000) return;
  const open = [];
  allPages(n).filter(p => p.active).forEach(p => openTasks(n, p.n).forEach(t => open.push({p:p.n, t})));
  if(!open.length) return;
  modal(`<h2>Welcome back</h2><p class="muted">It's been a while — here's everything outstanding, read-only.
    (The page suggests reading through all open items after an extended break.)</p>
    ${open.map(o => `<div class="task"><span class="box" style="cursor:default"></span>
      <span class="txt"><span class="meta">p${o.p+1} · </span>${esc(o.t.text)}</span></div>`).join("")}`);
}
window.go = go;
renderTabs();
go("list");
maybeCatchUp();
</script>
